name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: make build

      - name: unit and integration tests
        run: go test ./...

      - name: race detector
        run: go test -race ./...

      - name: smoke test the binary
        run: |
          ./bin/nulq version
          ./bin/nulq rules list
          ./bin/nulq system info --format json > /tmp/system.json
          ./bin/nulq scan --format json --output /tmp/report.json --modules identity,filesystem,system
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/report.json"))
          assert report["schema_version"] == "1.0"
          assert isinstance(report["findings"], list)
          assert isinstance(report["evidence"], list)
          print(f"schema ok: {len(report['findings'])} findings")
          PY

      - name: fail-on threshold contract
        run: |
          set +e
          ./bin/nulq scan --format json --fail-on info > /dev/null
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "unexpected exit status $status"
            exit 1
          fi
          echo "fail-on exit status: $status"

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: build linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /tmp/nulq ./cmd/nulq
