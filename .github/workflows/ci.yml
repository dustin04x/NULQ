name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  # Only request necessary permissions; avoid workflow permissions unless needed.

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify gofmt formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run go test (non-race)
        run: go test ./...

      - name: Run go test with race detector
        run: go test -race ./...

      - name: Cross-compile Linux AMD64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o /tmp/nulq-amd64 ./cmd/nulq

      - name: Cross-compile Linux ARM64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /tmp/nulq-arm64 ./cmd/nulq

      - name: Smoke test the binary (AMD64)
        env:
          PATH: /tmp:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          /tmp/nulq-amd64 version
          /tmp/nulq-amd64 rules list
          /tmp/nulq-amd64 system info --format json > /tmp/system.json
          /tmp/nulq-amd64 scan --format json --output /tmp/report.json --modules identity,filesystem,system

      - name: Fail-on threshold contract check
        env:
          FIXTURE_ROOT: /tmp/nulq-ci-test-root
        run: |
          # Ensure fixture directory exists and contains a world-writable
          # directory (produces a MEDIUM finding) so the fail-on contract
          # can be exercised against real findings.
          mkdir -p "$FIXTURE_ROOT/shared"
          chmod 777 "$FIXTURE_ROOT/shared"
          
          # The fixture produces max severity MEDIUM, so:
          # --fail-on info/low/medium should exit 3 (finding at/above threshold)
          # --fail-on high/critical should exit 0 (finding below threshold)
          set +e
          
          # info threshold (should be 3 - INFO finding exists)
          ./bin/nulq scan --root "$FIXTURE_ROOT" --format json --fail-on info > /dev/null 2>&1
          status_info=$?
          
          # low threshold (should be 3 - MEDIUM >= LOW)
          ./bin/nulq scan --root "$FIXTURE_ROOT" --format json --fail-on low > /dev/null 2>&1
          status_low=$?
          
          # medium threshold (should be 3 - MEDIUM >= MEDIUM)
          ./bin/nulq scan --root "$FIXTURE_ROOT" --format json --fail-on medium > /dev/null 2>&1
          status_medium=$?
          
          # high threshold (should be 0 - MEDIUM < HIGH)
          ./bin/nulq scan --root "$FIXTURE_ROOT" --format json --fail-on high > /dev/null 2>&1
          status_high=$?
          
          # critical threshold (should be 0 - MEDIUM < CRITICAL)
          ./bin/nulq scan --root "$FIXTURE_ROOT" --format json --fail-on critical > /dev/null 2>&1
          status_critical=$?
          
          set -e
          
          # Validate contract semantics
          if [ "$status_info" -ne 3 ]; then
            echo "FAIL: --fail-on info expected exit 3, got $status_info"
            exit 1
          fi
          if [ "$status_low" -ne 3 ]; then
            echo "FAIL: --fail-on low expected exit 3, got $status_low"
            exit 1
          fi
          if [ "$status_medium" -ne 3 ]; then
            echo "FAIL: --fail-on medium expected exit 3, got $status_medium"
            exit 1
          fi
          if [ "$status_high" -ne 0 ]; then
            echo "FAIL: --fail-on high expected exit 0, got $status_high"
            exit 1
          fi
          if [ "$status_critical" -ne 0 ]; then
            echo "FAIL: --fail-on critical expected exit 0, got $status_critical"
            exit 1
          fi
          
          echo "fail-on contract verification PASSED"

      - name: Verify README exit codes table
        run: |
          # Verify the exit codes table in README.md is consistent
          grep -A 4 '^| Code | Meaning' README.md | head -5
          echo "README exit codes check PASSED"

  release:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Release on master pushes
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Linux AMD64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X github.com/dustin04x/nulq/internal/version.Version=0.1.0-dev -X github.com/dustin04x/nulq/internal/version.Commit=${{ github.sha }} -X github.com/dustin04x/nulq/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o /tmp/nulq-amd64 ./cmd/nulq

      - name: Build Linux ARM64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags "-s -w -X github.com/dustin04x/nulq/internal/version.Version=0.1.0-dev -X github.com/dustin04x/nulq/internal/version.Commit=${{ github.sha }} -X github.com/dustin04x/nulq/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o /tmp/nulq-arm64 ./cmd/nulq

      - name: Verify binaries
        run: |
          # Verify the binary matching this runner's architecture
          # GitHub hosted runners are typically linux/amd64
          /tmp/nulq-amd64 version
          /tmp/nulq-amd64 rules list
        # Note: ARM64 binary verification skipped on amd64 runners;
        # cross-compiled arm64 binaries require arm64 runners or QEMU emulation
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nulq-linux-${{ runner.GOARCH }}-${{ github.sha }}
          path: /tmp/nulq-*
          retention-days: 7